name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run all tests (ci)
        run: pnpm run ci

  release-please-action:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release-action
        with:
          release-type: node
    outputs:
      is-release-created: ${{ steps.release-action.outputs.release_created }}

  release:
    needs: [release-please-action]
    if: ${{ needs.release-please-action.outputs.is-release-created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: NPM
            registry: https://registry.npmjs.org/
            token-name: NPM_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: ${{ matrix.registry }}

      - name: Create .npmrc
        run: echo "enable-pre-post-scripts=true" > .npmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build package
        run: pnpm run build

      - name: Publish to ${{ matrix.name }}
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets[matrix.token-name] }}
          NPM_CONFIG_PROVENANCE: true
